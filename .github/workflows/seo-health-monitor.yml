name: Weekly SEO health monitor

on:
  schedule:
    # Monday at 09:05 India Standard Time.
    - cron: "35 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-health:
    name: Check production indexing signals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check local blog image assets
        run: node scripts/seo-blog-assets-check.mjs
      - name: Check production SEO health
        run: node scripts/seo-health-check.mjs
      - name: Check full-sitemap technical SEO
        run: node scripts/seo-sitewide-technical-audit.mjs
      - name: Check keyword ownership consistency
        run: node --experimental-strip-types scripts/seo-keyword-ownership-check.ts
      - name: Check SEO content engine consistency
        run: node --experimental-strip-types scripts/seo-content-engine-check.ts
      - name: Check internal authority graph
        run: node --experimental-strip-types --import ./scripts/test-path-aliases.mjs scripts/seo-authority-graph-check.ts
      - name: Check competitor intelligence freshness
        run: node --experimental-strip-types scripts/seo-competitor-intelligence-check.ts
      - name: Check India regional expansion guardrails
        run: node --experimental-strip-types scripts/seo-india-expansion-check.ts
      - name: Check international SEO integrity
        run: node --experimental-strip-types scripts/seo-international-integrity-check.ts
      - name: Check Digital PR asset and outreach guardrails
        run: node --experimental-strip-types scripts/seo-digital-pr-check.ts
      - name: Check content distribution integrity
        run: node --experimental-strip-types --import ./scripts/test-path-aliases.mjs scripts/seo-content-distribution-check.ts
      - name: Check SERP snippet CTR health
        run: node scripts/seo-serp-ctr-audit.mjs
      - name: Check AI search and AEO readiness
        run: npm run seo:aeo
      - name: Check Phase 16 Instagram technical SEO
        run: node scripts/seo-instagram-technical-check.mjs
      - name: Check Phase 17 Instagram sitemap integrity
        run: node scripts/seo-instagram-sitemap-check.mjs
