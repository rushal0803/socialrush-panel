name: Generate secure dependency lock

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/generate-secure-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate package lock
        run: npm install --package-lock-only --legacy-peer-deps
      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "Update lockfile for patched Next and React"
          git push origin HEAD:${{ github.head_ref }}
