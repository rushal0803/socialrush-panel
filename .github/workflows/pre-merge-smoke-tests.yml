name: Pre-merge smoke tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Typecheck, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Smoke tests exercise auth-aware UI without needing a real Supabase project.
      # Pointing these at the local test server keeps unauthenticated requests
      # deterministic (404/no session) while preserving the real redirects.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_SUPABASE_ANON_KEY: smoke-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
