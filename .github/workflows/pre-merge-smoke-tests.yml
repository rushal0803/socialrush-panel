name: Pre-merge smoke tests

on:
  pull_request:
    branches:
      - main
      - feat/socialrush-phase3-readiness-20261115
      - feat/socialrush-phase2-premium-20261115
      - fix/socialrush-phase1-security-20261115
      - audit/socialrush-phase0-profit-20261115

permissions:
  contents: read

jobs:
  smoke:
    name: Typecheck, CRM pipeline tests, international SEO, build, and smoke test
    runs-on: ubuntu-latest
    # Integrated stack adds 110 browser cases and a local live-HTML SEO audit.
    # Individual assertion/route timeouts are unchanged.
    timeout-minutes: 25
    env:
      # Smoke tests exercise auth-aware UI without needing a real Supabase project.
      # Pointing these at the local test server keeps unauthenticated requests
      # deterministic (404/no session) while preserving the real redirects.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_ANON_KEY: smoke-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-service-role-key
      PLAYWRIGHT_BASE_URL: http://localhost:3001
      SEO_TRANSPORT_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Phase 4 consent denial withdrawal replay and posted-period finance
        run: |
          node --test tests/unit/phase4-consent.test.cjs tests/unit/phase4-isolation.test.cjs
          node --experimental-strip-types --test tests/unit/phase4-profit.test.ts tests/unit/profit-dashboard.test.ts
          node --experimental-strip-types --import ./scripts/test-path-aliases.mjs --test tests/unit/analytics-collection-environment.test.ts
      - name: Offline Phase 3 consent funnel and profit reconciliation fixtures
        run: node --experimental-strip-types --test tests/unit/phase3-intelligence.test.ts
      - name: Phase 1 stubbed security and recovery regressions
        run: node --test tests/unit/phase1-security.test.cjs
      - name: Offline net-profit scenario and incomplete-cost regressions
        run: node --test tests/unit/profit-scenario-model.test.mjs
      - name: Complete unit regressions and live catalogue equivalence
        run: npm run test:unit && npm run test:live-service-facts
      - name: Phase 1 canonical and crawl contract tests
        run: node --test tests/unit/phase1-seo-contract.test.mjs
      - name: Verify PR 624 blog image assets
        run: node scripts/seo-blog-assets-check.mjs
      - name: Package quantities, wallet states and customer navigation contracts
        run: node --experimental-strip-types --test tests/unit/packages-v2.test.ts tests/unit/dashboard-navigation.test.ts
      - name: Focused Q4 SEO regression tests
        run: node --experimental-strip-types --test tests/unit/seo-q4-phase2.test.ts tests/unit/seo-q4-phase3.test.ts tests/unit/seo-q4-phase4.test.ts tests/unit/seo-q4-phase5.test.ts tests/unit/seo-q4-phase6.test.ts tests/unit/seo-q4-phase7.test.ts tests/unit/seo-q4-phase8.test.ts tests/unit/seo-q4-phase9.test.ts tests/unit/seo-q4-phase10.test.ts tests/unit/seo-q4-phase11.test.ts tests/unit/seo-q4-phase12.test.ts tests/unit/seo-q4-phase13.test.ts tests/unit/seo-q4-phase14.test.ts tests/unit/seo-q4-phase15.test.ts tests/unit/seo-q4-phase16.test.ts tests/unit/search-demand-guides.test.ts tests/unit/order-requirements-intent.test.ts tests/unit/phase26-keyword-ownership.test.ts tests/unit/linkedin-service-seo.test.ts
      - run: node --check scripts/seo-instagram-technical-check.mjs
      - run: node --check scripts/seo-instagram-sitemap-check.mjs
      - run: node --check scripts/seo-sitewide-technical-audit.mjs
      - run: node --check scripts/seo-serp-ctr-audit.mjs
      - run: node --check scripts/seo-aeo-audit.mjs
      - run: node --experimental-strip-types --test tests/unit/phase16-technical-seo.test.ts tests/unit/phase17-instagram-sitemap.test.ts tests/unit/phase18-instagram-cwv.test.ts tests/unit/phase19-instagram-mobile-ux.test.ts tests/unit/phase20-instagram-cro.test.ts tests/unit/phase21-security-completion.test.ts tests/unit/phase22-responsive-shell.test.ts tests/unit/phase23-performance.test.ts tests/unit/phase24-indexation-command-center.test.ts tests/unit/phase25-technical-seo.test.ts tests/unit/phase26-keyword-ownership.test.ts tests/unit/phase27-content-engine.test.ts tests/unit/phase28-google-ctr.test.ts tests/unit/phase31-homepage-conversion.test.ts tests/unit/phase29-authority-graph.test.ts tests/unit/phase30-competitor-intelligence.test.ts tests/unit/phase32-service-page-cro.test.ts tests/unit/phase33-package-psychology.test.ts tests/unit/phase34-first-order-conversion.test.ts tests/unit/phase35-checkout-optimization.test.ts tests/unit/phase36-retention-engine.test.ts tests/unit/phase37-agency-reseller-growth.test.ts tests/unit/phase38-trust-engine.test.ts tests/unit/phase39-india-expansion.test.ts tests/unit/phase40-international-seo.test.ts tests/unit/phase41-digital-pr.test.ts tests/unit/phase42-content-distribution.test.ts tests/unit/phase43-referral-growth-loop.test.ts tests/unit/phase44-revenue-dashboard.test.ts tests/unit/phase45-traffic-engine.test.ts tests/unit/phase46-revenue-engine.test.ts tests/unit/phase47-quality-monitoring.test.ts tests/unit/phase48-ai-search-aeo.test.ts
      - name: Build integrated candidate with dotenv and outbound transport disabled
        run: node scripts/phase2-isolated.cjs build 3001
      - name: Start owned synthetic server for SEO and browser regression
        run: node scripts/phase4-qa-server.cjs start 3001
      - run: npm run seo:instagram-sitemap
      - run: npm run seo:ownership
      - run: npm run seo:content-engine
      - run: npm run seo:authority
      - run: npm run seo:competitors
      - run: npm run seo:india-expansion
      - run: npm run seo:international
      - run: npm run seo:digital-pr
      - run: npm run seo:distribution
      - run: npm run trust:audit
      - run: npm run test:order-notifications
      - run: npm run test:crm-pipeline
      - run: npm run test:international-seo
      - run: npm run test:payment-confidence
      - run: npm run test:phase12
      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.phase4.config.ts
        env:
          NODE_OPTIONS: --require=./scripts/phase4-no-dotenv.cjs
      - name: Authenticated customer search, navigation and wallet review (fixture only)
        timeout-minutes: 3
        env:
          NODE_OPTIONS: --require=./scripts/phase4-no-dotenv.cjs
          RESPONSIVE_PAYMENT_FIXTURE: '1'
          DASHBOARD_UPGRADE_AUDIT: '1'
          RESPONSIVE_STAGE: customer-release-gate
        run: |
          node scripts/phase4-qa-server.cjs stop 3001
          node scripts/phase4-qa-server.cjs start 3001
          npx playwright test tests/smoke/premium-responsive.spec.ts --config playwright.phase4.config.ts --grep 'dashboard search|dashboard drawer|order review preserves|customer order review keeps readable|customer orders prioritize|customer billing details|customer service search|customer funding' --workers=2 --global-timeout=150000 --output artifacts/phase4/customer-workspace --reporter=line
      - name: Native Chromium 200 percent zoom (synthetic localhost only)
        env:
          NODE_OPTIONS: --require=./scripts/phase4-no-dotenv.cjs
        run: node scripts/phase2-native-zoom.cjs
      - name: Attach customer workspace regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-workspace-fixture-qa
          path: artifacts/premium-responsive/customer-release-gate/
          retention-days: 7
          if-no-files-found: warn
      - name: Capture brand-correct screenshots of the real current PR code (local fixture only)
        if: ${{ (github.event.pull_request.number == 630 || github.event.pull_request.number == 632) && success() }}
        timeout-minutes: 3
        env:
          PREMIUM_REVIEW_ROUTES: '["/","/services","/packages","/login","/register"]'
        run: node scripts/premium-design-review.cjs brand-current
      - name: Attach current dark-orange visual-review screenshots
        if: ${{ (github.event.pull_request.number == 630 || github.event.pull_request.number == 632) && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: socialrush-pr630-brand-current-screenshots
          path: artifacts/premium-design/brand-current/
          if-no-files-found: warn
          retention-days: 14
      - name: Capture combined-phase support, reviews, tools and legal screenshots
        if: ${{ github.event.pull_request.number == 632 && success() }}
        timeout-minutes: 4
        run: node scripts/phase2-design-review.cjs
      - name: Attach combined Phase 2 public visual evidence
        if: ${{ github.event.pull_request.number == 632 && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: socialrush-integration-phase2-visual-review
          path: artifacts/phase2-design/
          retention-days: 14
          if-no-files-found: warn
      - name: Capture authenticated admin fixture layouts (isolated localhost only)
        if: ${{ github.event.pull_request.number == 632 && success() }}
        timeout-minutes: 4
        env:
          ADMIN_QA_FIXTURE: '1'
        run: node scripts/premium-admin-fixture-review.cjs
      - name: Attach admin fixture screenshots
        if: ${{ github.event.pull_request.number == 632 && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: socialrush-integration-admin-fixture
          path: artifacts/premium-integration-admin/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain Playwright release-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-diagnostics
          path: |
            test-results/seo-q4*320x700-chromium*/
            test-results/seo-q4*out-of-sitemap-chromium*/
            test-results/seo-q4*/error-context.md
            test-results/seo-q4-phase2*/
            test-results/services-v2*/
            test-results/phase2-premium*/
            artifacts/phase4/
            artifacts/phase2/native-zoom/*.png
            artifacts/phase2/native-zoom/results.json
            artifacts/service-final/chromium.log
            artifacts/service-final/smoke-server.log
            artifacts/packages-v2/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop owned synthetic server
        if: always()
        run: node scripts/phase4-qa-server.cjs stop 3001

  wallet-db-integration:
    name: Isolated PostgreSQL wallet approval and replay checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: wallet_fixture_only
          POSTGRES_DB: wallet_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute isolated wallet database integration tests
        env:
          PGPASSWORD: wallet_fixture_only
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d wallet_fixture -f tests/sql/manual-wallet-review.integration.sql
      - name: Test proposed analytics permissions in disposable PostgreSQL only
        env:
          PGPASSWORD: wallet_fixture_only
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d wallet_fixture -f tests/sql/phase4-analytics-permissions.integration.sql

  perf-evidence:
    name: PR 630 mobile/desktop performance evidence (non-release)
    if: ${{ github.event.pull_request.number == 630 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_ANON_KEY: smoke-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-service-role-key
      PERF_ROUTES: '["/","/services"]'
      PERF_PROFILES: desktop,mobile-4g
      PERF_RUNS: 3
      PERF_OUTPUT: artifacts/perf-pr630/current-branch.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Measure the real branch build using isolated fixture data
        run: node scripts/performance-benchmark.cjs
      - name: Retain raw lab samples; not comparable to the previous Windows host
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socialrush-pr630-current-branch-performance
          path: artifacts/perf-pr630/
          if-no-files-found: warn
          retention-days: 14
