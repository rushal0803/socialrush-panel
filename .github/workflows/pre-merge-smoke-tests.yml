name: Pre-merge smoke tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Typecheck, CRM pipeline tests, international SEO, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Smoke tests exercise auth-aware UI without needing a real Supabase project.
      # Pointing these at the local test server keeps unauthenticated requests
      # deterministic (404/no session) while preserving the real redirects.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_ANON_KEY: smoke-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Package quantities, discount authority and wallet states
        run: node --experimental-strip-types --test tests/unit/packages-v2.test.ts
      - name: Focused Q4 SEO regression tests
        run: node --experimental-strip-types --test tests/unit/seo-q4-phase2.test.ts tests/unit/seo-q4-phase3.test.ts tests/unit/seo-q4-phase4.test.ts tests/unit/seo-q4-phase5.test.ts tests/unit/seo-q4-phase6.test.ts tests/unit/seo-q4-phase7.test.ts tests/unit/seo-q4-phase8.test.ts tests/unit/seo-q4-phase9.test.ts tests/unit/seo-q4-phase10.test.ts tests/unit/search-demand-guides.test.ts tests/unit/order-requirements-intent.test.ts tests/unit/phase26-keyword-ownership.test.ts tests/unit/linkedin-service-seo.test.ts
      - run: node --check scripts/seo-instagram-technical-check.mjs
      - run: node --check scripts/seo-instagram-sitemap-check.mjs
      - run: node --check scripts/seo-sitewide-technical-audit.mjs
      - run: node --check scripts/seo-serp-ctr-audit.mjs
      - run: node --check scripts/seo-aeo-audit.mjs
      - run: node --experimental-strip-types --test tests/unit/phase16-technical-seo.test.ts tests/unit/phase17-instagram-sitemap.test.ts tests/unit/phase18-instagram-cwv.test.ts tests/unit/phase19-instagram-mobile-ux.test.ts tests/unit/phase20-instagram-cro.test.ts tests/unit/phase21-security-completion.test.ts tests/unit/phase22-responsive-shell.test.ts tests/unit/phase23-performance.test.ts tests/unit/phase24-indexation-command-center.test.ts tests/unit/phase25-technical-seo.test.ts tests/unit/phase26-keyword-ownership.test.ts tests/unit/phase27-content-engine.test.ts tests/unit/phase28-google-ctr.test.ts tests/unit/phase31-homepage-conversion.test.ts tests/unit/phase29-authority-graph.test.ts tests/unit/phase30-competitor-intelligence.test.ts tests/unit/phase32-service-page-cro.test.ts tests/unit/phase33-package-psychology.test.ts tests/unit/phase34-first-order-conversion.test.ts tests/unit/phase35-checkout-optimization.test.ts tests/unit/phase36-retention-engine.test.ts tests/unit/phase37-agency-reseller-growth.test.ts tests/unit/phase38-trust-engine.test.ts tests/unit/phase39-india-expansion.test.ts tests/unit/phase40-international-seo.test.ts tests/unit/phase41-digital-pr.test.ts tests/unit/phase42-content-distribution.test.ts tests/unit/phase43-referral-growth-loop.test.ts tests/unit/phase44-revenue-dashboard.test.ts tests/unit/phase45-traffic-engine.test.ts tests/unit/phase46-revenue-engine.test.ts tests/unit/phase47-quality-monitoring.test.ts tests/unit/phase48-ai-search-aeo.test.ts
      - run: npm run seo:instagram-sitemap
      - run: npm run seo:ownership
      - run: npm run seo:content-engine
      - run: npm run seo:authority
      - run: npm run seo:competitors
      - run: npm run seo:india-expansion
      - run: npm run seo:international
      - run: npm run seo:digital-pr
      - run: npm run seo:distribution
      - run: npm run trust:audit
      - run: npm run test:crm-pipeline
      - run: npm run test:international-seo
      - run: npm run test:payment-confidence
      - run: npm run test:phase12
      - run: npm run build
      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Retain Playwright release-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-diagnostics
          path: |
            test-results/seo-q4*320x700-chromium*/
            test-results/seo-q4*out-of-sitemap-chromium*/
            test-results/seo-q4*/error-context.md
            test-results/seo-q4-phase2*/
            artifacts/service-final/chromium.log
            artifacts/service-final/smoke-server.log
            artifacts/packages-v2/
          retention-days: 7
          if-no-files-found: warn
