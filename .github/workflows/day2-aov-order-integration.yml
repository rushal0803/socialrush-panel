name: Day 2 AOV order integration

on:
  push:
    branches:
      - growth/day2-aov-order-integration

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth/day2-aov-order-integration
          fetch-depth: 0

      - name: Wire quantity merchandising into New Order
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("app/dashboard/new-order/page.tsx")
          text = path.read_text()

          personalization_import = 'import { addRecentService, CONTINUE_ORDER_KEY, parseRecentServices, RECENT_SERVICES_KEY, serializeContinueOrder } from "@/lib/cro/personalization";\n'
          merchandising_import = 'import { buildQuantityMerchandising } from "@/lib/cro/quantity-merchandising";\n'
          if merchandising_import not in text:
              if personalization_import not in text:
                  raise SystemExit("personalization import anchor not found")
              text = text.replace(personalization_import, personalization_import + merchandising_import, 1)

          text, removed = re.subn(
              r'\nfunction validQuickQuantities\(service: SmmService\) \{.*?\n\}\n\nfunction compactQuantity',
              '\nfunction compactQuantity',
              text,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f"expected to remove 1 legacy quick-quantity helper, removed {removed}")

          old_const = '  const quickQuantities = selectedService ? validQuickQuantities(selectedService) : [];'
          new_const = '  const quantityOptions = selectedService ? buildQuantityMerchandising(selectedService) : [];\n  const quickQuantities = quantityOptions.map((option) => option.value);'
          if old_const not in text:
              raise SystemExit("quick quantity state anchor not found")
          text = text.replace(old_const, new_const, 1)

          block_pattern = re.compile(
              r'\{quickQuantities\.length > 0 && <div className="mt-4 flex flex-wrap gap-2">\{quickQuantities\.map\(\(value\) => <button.*?</button>\)\}</div>\}',
              re.S,
          )
          replacement = '''{quantityOptions.length > 0 && <section className="mt-5" aria-label="Recommended quantity options">
                <div className="flex items-end justify-between gap-3"><div><p className="text-xs font-black text-white">Choose a quantity</p><p className="mt-1 text-[11px] text-[#8F949D]">Quick options based on this service’s live limits.</p></div><span className="hidden text-[10px] font-bold uppercase tracking-wider text-[#777] sm:inline">Same live rate</span></div>
                <div className="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-3">{quantityOptions.map((option) => {
                  const selected = quantity === option.value;
                  const emphasis = option.emphasis === "popular" ? "border-orange-400/50 bg-orange-500/[.08]" : option.emphasis === "scale" ? "border-emerald-400/35 bg-emerald-500/[.06]" : "border-white/10 bg-white/[.035]";
                  const optionPrice = Math.round((option.value * selectedService.pricePer1000 * 100) / 1000) / 100;
                  return <button key={option.value} type="button" aria-pressed={selected} onClick={() => { setQuantityInput(String(option.value)); setError(""); }} className={`relative min-h-20 rounded-xl border px-3 py-3 text-left transition hover:border-orange-300/60 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-300 ${selected ? "border-orange-400 bg-orange-500/15 ring-2 ring-orange-500/10" : emphasis}`}>
                    <span className="flex items-start justify-between gap-2"><strong className="text-sm font-black text-white">{compactQuantity(option.value)}</strong>{option.label ? <span className={`rounded-full px-2 py-1 text-[9px] font-black uppercase tracking-wide ${option.emphasis === "popular" ? "bg-orange-500/20 text-orange-200" : option.emphasis === "scale" ? "bg-emerald-500/15 text-emerald-200" : "bg-white/10 text-[#C7CBD1]"}`}>{option.label}</span> : null}</span>
                    <span className="mt-2 block text-xs font-bold text-[#B8BDC6]">{formatCurrency(optionPrice, currency)}</span>
                  </button>;
                })}</div>
                <p className="mt-2 text-[10px] leading-4 text-[#777]">These labels guide quantity selection only. Your live rate, service limits and checkout validation stay unchanged.</p>
              </section>}'''
          text, replaced = block_pattern.subn(replacement, text, count=1)
          if replaced != 1:
              raise SystemExit(f"expected to replace 1 quantity-button block, replaced {replaced}")

          path.write_text(text)
          Path(".github/workflows/day2-aov-order-integration.yml").unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/new-order/page.tsx .github/workflows/day2-aov-order-integration.yml
          git commit -m "integrate AOV quantity merchandising into new order"
          git push origin HEAD:growth/day2-aov-order-integration
