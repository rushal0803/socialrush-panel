plugins { id 'com.android.application' }

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("keystore.properties")
if (signingPropertiesFile.exists()) signingPropertiesFile.withInputStream { signingProperties.load(it) }

android {
    namespace 'com.getsocialrush.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.getsocialrush.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingPropertiesFile.exists()) signingConfig signingConfigs.release
        }
    }
    sourceSets {
        main.res.srcDirs += "$buildDir/generated/res/socialrush"
    }
}

// Package the existing website brand icon into the Android launcher resources.
tasks.register('syncBrandAssets', Copy) {
    from('../public/images/brand/socialrush-icon.png')
    into(layout.buildDirectory.dir('generated/res/socialrush/mipmap-xxxhdpi'))
    rename { 'socialrush_icon.png' }
}
tasks.named('preBuild').configure { dependsOn(tasks.named('syncBrandAssets')) }

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}

android {
    lint {
        checkReleaseBuilds false
    }
}

